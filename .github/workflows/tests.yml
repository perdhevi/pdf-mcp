name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tesseract
        # fonts-dejavu-core: the scanned-invoice fixture renders with DejaVuSans for reliable OCR.
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-dejavu-core
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run pytest
