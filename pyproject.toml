[project]
name = "pdf-mcp"
version = "0.1.0"
description = "MCP server for per-customer PDF document management and RAG (Qdrant + Ollama/OpenAI-compatible models)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "qdrant-client>=1.15",
    "pymupdf>=1.26",
    "pytesseract>=0.3.13",
    "pillow>=11",
    "httpx>=0.28",
    "watchdog>=6",
    "pydantic-settings>=2.10",
    "uvicorn>=0.35",
    "starlette>=0.47",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pdf-mcp = "pdf_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
